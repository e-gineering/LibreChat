# For more information, see the Configuration Guide:
# https://www.librechat.ai/docs/configuration/librechat_yaml

# Configuration version (required)
version: 1.3.4

# OCR
ocr:
  mistralModel: "mistral-ocr-2503-edge"                  # Should match your Azure deployment name
  apiKey: "${AZURE_MISTRAL_OCR_API_KEY}"                 # Reference to your Azure API key in .env
  baseURL: "https://mistral-ocr-2503-edge.eastus2.models.ai.azure.com/v1"  # Your Azure endpoint
  strategy: "azure_mistral_ocr"                          # Use Azure strategy

# User memory — key/value store persisted across conversations
memory:
  tokenLimit: 3000
  agent:
    provider: "azureOpenAI"
    model: "gpt-5-nano"

# Azure OpenAI endpoint (used by memory agent)
endpoints:
  azureOpenAI:
    groups:
      - group: "img-librechat"
        apiKey: "${AZURE_OPENAI_API_KEY}"
        instanceName: "openai-img-librechat-02"
        version: "2025-01-01-preview"
        models:
          gpt-5-nano:
            deploymentName: "gpt-5-nano"

# Web Search Configuration
webSearch:
  serperApiKey: "${SERPER_API_KEY}"

# Interface configuration
interface:
  mcpServers:
    use: true       # Enable users to USE configured MCP servers
    create: true    # Enable users to CREATE new MCP servers
    share: true     # Enable users to SHARE MCP servers